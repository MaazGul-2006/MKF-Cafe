<!DOCTYPE html>
<html>
<head>
    <title>MKF Cafe - Reservations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background-color: white;
            border-radius: 8px;
        }

        header {
            background-color: #000;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .navigation {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }

        .navigation a:hover {
            color: #ddd;
        }

        .form-section {
            padding: 30px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #000;
        }

        textarea {
            height: 100px;
        }

        .submit-btn {
            background-color: #000;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        footer {
            background-color: #000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>MKF CAFE</h1>
            <p>Reservation Request</p>
        </header>

        <div class="navigation">
            <a href="index.html">HOME</a>
            <a href="menu.html">MENU</a>
            <a href="reservation.html">RESERVATIONS</a>
            <a href="events.html">EVENTS</a>
            <a href="contact.html">CONTACT</a>
            <a href="about.html">ABOUT US</a>
        </div>

        <div class="form-section">
            <h2>Make a Reservation</h2>

            <form action="https://formspree.io/f/YOUR_FORM_ID_HERE" method="POST">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" placeholder="Enter your last name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="your.email@example.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="+92 300 1234567" required>
                </div>

                <div class="form-group">
                    <label>Reservation Date</label>
                    <input type="date" name="reservationDate" required>
                </div>

                <div class="form-group">
                    <label>Reservation Time</label>
                    <input type="time" name="reservationTime" required>
                </div>

                <div class="form-group">
                    <label>Number of Guests</label>
                    <select name="numberOfGuests" required>
                        <option value="">Select number of guests</option>
                        <option value="1">1 person</option>
                        <option value="2">2 people</option>
                        <option value="3">3 people</option>
                        <option value="4">4 people</option>
                        <option value="5">5 people</option>
                        <option value="6">6 people</option>
                        <option value="7">7 people</option>
                        <option value="8">8 people</option>
                        <option value="9">9+ people</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Special Requests</label>
                    <textarea name="specialRequests" placeholder="Any special requests or dietary restrictions?"></textarea>
                </div>

                <button type="submit" class="submit-btn">SEND RESERVATION</button>

            </form>
        </div>

        <footer>
            <p>&copy; 2025 MKF Cafe. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
